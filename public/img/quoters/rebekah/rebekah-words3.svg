<text id="He is a very talented UX Designer with a good eye for incorporating what&#226;&#128;&#153;s really important." fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="336.711" y="147.983">He is a very &#10;</tspan><tspan x="297.723" y="165.983">talented UX Designer &#10;</tspan><tspan x="300.705" y="183.983">with a good eye for &#10;</tspan><tspan x="295.983" y="201.983">incorporating what&#x2019;s &#10;</tspan><tspan x="314.252" y="219.983">really important. </tspan></text>
<text id="Corey is responsible and reliable &#226;&#128;&#147; I never had any concerns he&#226;&#128;&#153;d produce a quality project on time.&#226;&#128;&#157;" fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="360.599" y="250.986">Corey is &#10;</tspan><tspan x="328.032" y="268.986">responsible and &#10;</tspan><tspan x="326.081" y="286.986">reliable &#x2013; I never &#10;</tspan><tspan x="305.743" y="304.986">had any concerns he&#x2019;d </tspan><tspan x="323.995" y="322.986">produce a quality&#10;</tspan><tspan x="326.825" y="340.986">project on time.&#x201d;</tspan></text>
<text id="&#226;&#128;&#156;As his manager, I appreciated Corey&#39;s willingness to learn new things and take on challenging projects." fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="306.882" y="35.9829">&#x201c;As his manager, &#10;</tspan><tspan x="289.152" y="53.9829">I appreciated Corey&#39;s </tspan><tspan x="246.49" y="71.9829">willingness to learn new things </tspan><tspan x="277.41" y="89.9829">and take on challenging </tspan><tspan x="335.804" y="107.983">projects. </tspan></text>
</g>
