<text id="He is a very talented UX Designer with a good eye for incorporating what&#226;&#128;&#153;s really important." fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="116.711" y="148.233">He is a very &#10;</tspan><tspan x="77.7227" y="166.233">talented UX Designer &#10;</tspan><tspan x="80.7051" y="184.233">with a good eye for &#10;</tspan><tspan x="75.9824" y="202.233">incorporating what&#x2019;s &#10;</tspan><tspan x="94.252" y="220.233">really important. </tspan></text>
<text id="Corey is responsible and reliable &#226;&#128;&#147; I never had any concerns he&#226;&#128;&#153;d produce a quality project on time.&#226;&#128;&#157;" fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="140.599" y="251.236">Corey is &#10;</tspan><tspan x="108.032" y="269.236">responsible and &#10;</tspan><tspan x="106.081" y="287.236">reliable &#x2013; I never &#10;</tspan><tspan x="85.743" y="305.236">had any concerns he&#x2019;d </tspan><tspan x="103.995" y="323.236">produce a quality&#10;</tspan><tspan x="106.825" y="341.236">project on time.&#x201d;</tspan></text>
<text id="&#226;&#128;&#156;As his manager, I appreciated Corey&#39;s willingness to learn new things and take on challenging projects." fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="86.8823" y="36.2329">&#x201c;As his manager, &#10;</tspan><tspan x="69.1519" y="54.2329">I appreciated Corey&#39;s </tspan><tspan x="26.4897" y="72.2329">willingness to learn new things </tspan><tspan x="57.4097" y="90.2329">and take on challenging </tspan><tspan x="115.804" y="108.233">projects. </tspan></text>
