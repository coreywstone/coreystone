<text id="His ability to listen and teach created a supportive environment, and his constructive feedback encouraged critical thinking." fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="334.793" y="158.983">His ability to listen&#10;</tspan><tspan x="328.723" y="176.983"> and teach created a </tspan><tspan x="315.305" y="194.983">supportive environment, </tspan><tspan x="329.086" y="212.983">and his constructive </tspan><tspan x="324.908" y="230.983">feedback encouraged </tspan><tspan x="347.397" y="248.983">critical thinking.</tspan></text>
<text id="&#226;&#128;&#156;At Chegg, Corey provided exceptional mentorship that significantly enhanced my growth as a UX designer." fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="378.985" y="33.9595">&#x201c;At Chegg, &#10;</tspan><tspan x="358.267" y="51.9595">Corey provided &#10;</tspan><tspan x="327.821" y="69.9595">exceptional mentorship </tspan><tspan x="311.567" y="87.9595">that significantly enhanced </tspan><tspan x="348.124" y="105.959">my growth as a UX </tspan><tspan x="385.132" y="123.959">designer.</tspan></text>
</g>
