<text id="He has a rich understanding of UX research, marketing, customer funnels, and value laddering." fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="421.946" y="147.233">He has a rich&#10;</tspan><tspan x="387.129" y="165.233">understanding of UX &#10;</tspan><tspan x="386.426" y="183.233">research, marketing, &#10;</tspan><tspan x="377.367" y="201.233">customer funnels, and &#10;</tspan><tspan x="407.156" y="219.233">value laddering. </tspan></text>
<text id="Corey is a fantastic team player, always sharing knowledge.&#226;&#128;&#157;" fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="426.984" y="263.236">Corey is a &#10;</tspan><tspan x="376.798" y="281.236">fantastic team player, &#10;</tspan><tspan x="405.345" y="299.236">always sharing &#10;</tspan><tspan x="421.16" y="317.236">knowledge.&#x201d;</tspan></text>
<text id="&#226;&#128;&#156;Corey continually raised the bar in intelligent UX design, prototyping, A/B testing, and maximizing conversions." fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="397.849" y="29.2095">&#x201c;Corey &#10;</tspan><tspan x="349.702" y="47.2095">continually raised &#10;</tspan><tspan x="302.095" y="65.2095">the bar in intelligent UX design, </tspan><tspan x="308.341" y="83.2095">prototyping, A/B testing, and </tspan><tspan x="331.544" y="101.209">maximizing conversions. </tspan></text>
