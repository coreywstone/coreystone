<text fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="85.7559" y="106.233">He consistently &#10;</tspan><tspan x="57.2266" y="124.233">brings innovative ideas &#10;</tspan><tspan x="38.8398" y="142.233">that not only address past </tspan><tspan x="46.8789" y="160.233">challenges but also pave &#10;</tspan><tspan x="73.6855" y="178.233">the way for future &#10;</tspan><tspan x="93.3906" y="196.233">advancements. </tspan></text>
<text fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="100.87" y="230.236">In addition to &#10;</tspan><tspan x="77.509" y="248.236">his design prowess, &#10;</tspan><tspan x="76.3606" y="266.236">Corey is a fantastic &#10;</tspan><tspan x="82.8762" y="284.236">collaborator and &#10;</tspan><tspan x="107.304" y="302.236">team player.&#x201d;</tspan></text>
<text fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="155.669" y="31.2095">&#x201c;I cannot &#10;</tspan><tspan x="124.31" y="49.2095">recommend Corey </tspan><tspan x="138.905" y="67.2095">highly enough. </tspan></text>
