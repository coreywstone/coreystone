<text id="He proactively moves projects forward with minimal guidance and oversight, unafraid to tackle complex problems and always brings a fresh point of view." fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="375.096" y="127.983">He proactively &#10;</tspan><tspan x="313.314" y="145.983">moves projects forward with </tspan><tspan x="307.438" y="163.983">minimal guidance and oversight, </tspan><tspan x="324.699" y="181.983">unafraid to tackle complex </tspan><tspan x="312.066" y="199.983">problems and always brings a </tspan><tspan x="356.686" y="217.983">fresh point of view. </tspan></text>
<text id="&#226;&#128;&#156;Corey is an excellent designer with strong technical chops." fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="349.451" y="34.9551">&#x201c;Corey is an &#10;</tspan><tspan x="322.421" y="52.9551">excellent designer &#10;</tspan><tspan x="312.683" y="70.9551">with strong technical </tspan><tspan x="374.447" y="88.9551">chops. </tspan></text>
