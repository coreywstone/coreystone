<text fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="126.565" y="36.2449">&#x201c;Corey is very &#10;</tspan><tspan x="86.3877" y="54.2449">collaborative, creative, &#10;</tspan><tspan x="114.671" y="72.2449">and super fun to &#10;</tspan><tspan x="144.185" y="90.2449">work with.</tspan></text>
<text fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="103.645" y="127.239">He has a knack &#10;</tspan><tspan x="90.5142" y="145.239">for solving tricky </tspan><tspan x="123.889" y="163.239">problems.</tspan></text>
<text fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="86.6521" y="211.239">I was always &#10;</tspan><tspan x="74.6169" y="229.239">impressed by his &#10;</tspan><tspan x="42.2087" y="247.239">ability to describe ideas, </tspan><tspan x="64.2048" y="265.239">and willingness to &#10;</tspan><tspan x="91.7673" y="283.239">brainstorm.&#x201d;</tspan></text>
