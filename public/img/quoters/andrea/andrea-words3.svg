<text id="&#226;&#128;&#156;Corey is very collaborative, creative, and super fun to work with." fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="110.565" y="36.2449">&#x201c;Corey is very &#10;</tspan><tspan x="70.3877" y="54.2449">collaborative, creative, &#10;</tspan><tspan x="98.6709" y="72.2449">and super fun to &#10;</tspan><tspan x="128.185" y="90.2449">work with.</tspan></text>
<text id="He has a knack for solving tricky problems." fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="87.645" y="127.239">He has a knack &#10;</tspan><tspan x="74.5142" y="145.239">for solving tricky </tspan><tspan x="107.889" y="163.239">problems.</tspan></text>
<text id="I was always impressed by his ability to describe ideas, and willingness to brainstorm.&#226;&#128;&#157;" fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="70.6521" y="211.239">I was always &#10;</tspan><tspan x="58.6169" y="229.239">impressed by his &#10;</tspan><tspan x="26.2087" y="247.239">ability to describe ideas, </tspan><tspan x="48.2048" y="265.239">and willingness to &#10;</tspan><tspan x="75.7673" y="283.239">brainstorm.&#x201d;</tspan></text>
</g>
