<text fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="136.229" y="155.233">He collaborates &#10;</tspan><tspan x="94.6504" y="173.233">well and builds consensus &#10;</tspan><tspan x="113.014" y="191.233">by listening deeply and </tspan><tspan x="121.252" y="209.233">communicating ideas &#10;</tspan><tspan x="157.996" y="227.233">with clarity.</tspan></text>
<text fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="75.1058" y="40.2094">&#x201c;Corey enthusiastically &#10;</tspan><tspan x="35.5844" y="58.2094">dives into any problem, no matter </tspan><tspan x="29.5199" y="76.2094">how ambiguous or complex, always </tspan><tspan x="47.016" y="94.2094">finding a thoughtful, practical &#10;</tspan><tspan x="118.547" y="112.209">way forward. </tspan></text>
