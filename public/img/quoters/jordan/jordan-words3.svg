<text id="He collaborates well and builds consensus by listening deeply and communicating ideas with clarity." fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="360.229" y="155.24">He collaborates &#10;</tspan><tspan x="318.65" y="173.24">well and builds consensus &#10;</tspan><tspan x="337.014" y="191.24">by listening deeply and </tspan><tspan x="345.252" y="209.24">communicating ideas &#10;</tspan><tspan x="381.996" y="227.24">with clarity.</tspan></text>
<text id="Corey constantly brings fresh ideas for how AI can enhance our work, inspiring the team to experiment and move faster.&#226;&#128;&#157;" fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="380.435" y="268.243">Corey constantly &#10;</tspan><tspan x="345.642" y="286.243">brings fresh ideas for how&#10;</tspan><tspan x="348.173" y="304.243"> AI can enhance our work, &#10;</tspan><tspan x="370.287" y="322.243">inspiring the team to &#10;</tspan><tspan x="393.906" y="340.243">experiment and &#10;</tspan><tspan x="401.406" y="358.243">move faster.&#x201d;</tspan></text>
<text id="&#226;&#128;&#156;Corey enthusiastically dives into any problem, no matter how ambiguous or complex, always finding a thoughtful, practical way forward." fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="299.106" y="40.2167">&#x201c;Corey enthusiastically &#10;</tspan><tspan x="259.584" y="58.2167">dives into any problem, no matter </tspan><tspan x="253.52" y="76.2167">how ambiguous or complex, always </tspan><tspan x="271.016" y="94.2167">finding a thoughtful, practical &#10;</tspan><tspan x="342.547" y="112.217">way forward. </tspan></text>
