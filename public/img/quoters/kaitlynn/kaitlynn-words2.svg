<text id="He creates great solutions that both delight the customer and save money and time for the company." fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="83.832" y="125.983">He creates &#10;</tspan><tspan x="40.5547" y="143.983">great solutions that &#10;</tspan><tspan x="19.9824" y="161.983">both delight the customer &#10;</tspan><tspan x="29.5801" y="179.983">and save money and time&#10;</tspan><tspan x="57.7109" y="197.983"> for the company. </tspan></text>
<text id="&#226;&#128;&#156;Corey can bring an idea to life by turning team brainstorming into a clear product design." fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="102.079" y="36.9595">&#x201c;Corey can bring&#10;</tspan><tspan x="68.7273" y="54.9595">an idea to life by turning </tspan><tspan x="63.4363" y="72.9595">team brainstorming into a </tspan><tspan x="81.4949" y="90.9595">clear product design. </tspan></text>
