<text fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="96.832" y="126.233">He creates &#10;</tspan><tspan x="53.5547" y="144.233">great solutions that &#10;</tspan><tspan x="32.9824" y="162.233">both delight the customer &#10;</tspan><tspan x="42.5801" y="180.233">and save money and time&#10;</tspan><tspan x="70.7109" y="198.233"> for the company. </tspan></text>
<text fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="105.853" y="242.236">Corey is also a &#10;</tspan><tspan x="60.0032" y="260.236">great team member, always </tspan><tspan x="66.4075" y="278.236">bringing ideas along with &#10;</tspan><tspan x="94.7317" y="296.236">a sense of humor.&#x201d;</tspan></text>
<text fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="115.079" y="37.2095">&#x201c;Corey can bring&#10;</tspan><tspan x="81.7273" y="55.2095">an idea to life by turning </tspan><tspan x="76.4363" y="73.2095">team brainstorming into a </tspan><tspan x="94.4949" y="91.2095">clear product design. </tspan></text>
