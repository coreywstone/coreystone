<text id="His ability to empathize with users, ask insightful questions, and turn ideas into elegant, intuitive experiences raises the bar on every project.&#226;&#128;&#157;" fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="388.541" y="160.233">His ability to &#10;</tspan><tspan x="340.254" y="178.233">empathize with users, ask </tspan><tspan x="319.184" y="196.233">insightful questions, and turn </tspan><tspan x="332.42" y="214.233">ideas into elegant, intuitive </tspan><tspan x="335.982" y="232.233">experiences raises the bar&#10;</tspan><tspan x="364.635" y="250.233"> on every project.&#x201d; </tspan></text>
<text id="&#226;&#128;&#156;Corey is one of the best collaborators I&#226;&#128;&#153;ve ever worked with: thoughtful, open, and deeply committed to finding the best path forward." fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="319.575" y="40.2559">&#x201c;Corey is one of the best </tspan><tspan x="290.911" y="58.2559">collaborators I&#x2019;ve ever worked </tspan><tspan x="284.331" y="76.2559">with: thoughtful, open, and deeply </tspan><tspan x="320.325" y="94.2559">committed to finding the &#10;</tspan><tspan x="344.806" y="112.256">best path forward. </tspan></text>
