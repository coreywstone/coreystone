<text fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="143.541" y="160.233">His ability to &#10;</tspan><tspan x="95.2539" y="178.233">empathize with users, ask </tspan><tspan x="74.1836" y="196.233">insightful questions, and turn </tspan><tspan x="87.4199" y="214.233">ideas into elegant, intuitive </tspan><tspan x="90.9824" y="232.233">experiences raises the bar&#10;</tspan><tspan x="119.635" y="250.233"> on every project.&#x201d; </tspan></text>
<text fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="74.5752" y="40.2559">&#x201c;Corey is one of the best </tspan><tspan x="45.9111" y="58.2559">collaborators I&#x2019;ve ever worked </tspan><tspan x="39.3311" y="76.2559">with: thoughtful, open, and deeply </tspan><tspan x="75.3252" y="94.2559">committed to finding the &#10;</tspan><tspan x="99.8057" y="112.256">best path forward. </tspan></text>
