<text id="His process is focused and disciplined, defining the problem clearly and delivering creative yet practical solutions." fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="394.18" y="137.24">His process is &#10;</tspan><tspan x="353.03" y="155.24">focused and disciplined, &#10;</tspan><tspan x="335.217" y="173.24">defining the problem clearly &#10;</tspan><tspan x="346.098" y="191.24">and delivering creative yet </tspan><tspan x="370.948" y="209.24">practical solutions. </tspan></text>
<text id="He collaborates seamlessly and brings curiosity, ownership, and a steady sense of maturity to every project.&#226;&#128;&#157;" fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="378.931" y="250.243">He collaborates &#10;</tspan><tspan x="353.982" y="268.243">seamlessly and brings &#10;</tspan><tspan x="337.107" y="286.243">curiosity, ownership, and a &#10;</tspan><tspan x="343.031" y="304.243">steady sense of maturity &#10;</tspan><tspan x="374.566" y="322.243">to every project.&#x201d;</tspan></text>
<text id="&#226;&#128;&#156;Corey always ties design decisions to real user and Business outcomes." fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="397.849" y="33.2167">&#x201c;Corey &#10;</tspan><tspan x="351.858" y="51.2167">always ties design </tspan><tspan x="335.739" y="69.2167">decisions to real user  </tspan><tspan x="374.833" y="87.2167">and Business </tspan><tspan x="385.017" y="105.217">outcomes.</tspan></text>
