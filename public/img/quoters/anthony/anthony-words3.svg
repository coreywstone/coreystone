<text id="His process is focused and disciplined, defining the problem clearly and delivering creative yet practical solutions." fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="231.18" y="93.2328">His process is &#10;</tspan><tspan x="190.029" y="111.233">focused and disciplined, &#10;</tspan><tspan x="172.217" y="129.233">defining the problem clearly &#10;</tspan><tspan x="183.098" y="147.233">and delivering creative yet </tspan><tspan x="207.947" y="165.233">practical solutions. </tspan></text>
<text id="He collaborates seamlessly and brings curiosity, ownership, and a steady sense of maturity to every project.&#226;&#128;&#157;" fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="256.931" y="217.236">He collaborates &#10;</tspan><tspan x="231.982" y="235.236">seamlessly and brings &#10;</tspan><tspan x="215.107" y="253.236">curiosity, ownership, and a &#10;</tspan><tspan x="221.031" y="271.236">steady sense of maturity &#10;</tspan><tspan x="252.566" y="289.236">to every project.&#x201d;</tspan></text>
<text id="&#226;&#128;&#156;Corey always ties design decisions to real user and Business outcomes." fill="#262629" xml:space="preserve" style="white-space: pre" font-family="Anime Ace" font-size="12" letter-spacing="0em"><tspan x="75.8486" y="29.2094">&#x201c;Corey &#10;</tspan><tspan x="29.8584" y="47.2094">always ties design </tspan><tspan x="13.7393" y="65.2094">decisions to real user  </tspan><tspan x="52.833" y="83.2094">and Business </tspan><tspan x="63.0166" y="101.209">outcomes.</tspan></text>
